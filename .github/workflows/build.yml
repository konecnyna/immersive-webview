name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Run Unit Tests
        run: gradle testDebugUnitTest

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.${{ github.run_number }}
          name: v1.2.${{ github.run_number }}
          body: |
            ## Immersive WebView v1.2

            ### What's new in v1.2
            - **Toggleable immersive mode** — content respects the status bar by default; enable "Immersive (under status bar)" in the overflow menu to draw behind it
            - Carries over v1.1: cleartext HTTP, cache modes, clear cache, lifecycle pause/resume

            ### Stack
            - **Kotlin 2.3** + **Compose compiler plugin**
            - **Jetpack Compose BOM 2026.05** + **Material 3** (Material You dynamic colors)
            - **AndroidX WebKit 1.16** for modern WebView APIs
            - **AGP 8.13** / **Gradle 8.14** / **compileSdk 36** (Android 16)

            ### Install
            Download `app-debug.apk` and sideload onto your Android device.
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
