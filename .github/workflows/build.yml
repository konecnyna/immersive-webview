name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Run Unit Tests
        run: gradle testDebugUnitTest

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          body: |
            ## Immersive WebView

            Modern Android WebView app built with:
            - **Jetpack Compose** + **Material 3** (Material You dynamic colors)
            - **AndroidX WebKit** for modern WebView APIs
            - **Edge-to-edge** immersive display (draws behind status bar)
            - **Customizable URL** via edit dialog
            - **Bottom navigation**: Back, Forward, Reload, Edit URL
            - **Kotlin 2.1** + **Compose compiler plugin**

            ### Install
            Download `app-debug.apk` and sideload onto your Android device.
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
