name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Run Unit Tests
        run: gradle testDebugUnitTest

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: v1.1.${{ github.run_number }}
          body: |
            ## Immersive WebView v1.1

            Modern Android WebView app built with:
            - **Kotlin 2.3** + **Compose compiler plugin**
            - **Jetpack Compose BOM 2026.05** + **Material 3** (Material You dynamic colors)
            - **AndroidX WebKit 1.16** for modern WebView APIs
            - **AGP 8.13** / **Gradle 8.14** / **compileSdk 36** (Android 16)
            - **Edge-to-edge** immersive display (draws behind status bar)

            ### What's new in v1.1
            - **Cleartext HTTP support** — load `http://` sites and local network addresses
            - **Cache management** — choose Default, Cache First, No Cache, or Cache Only mode
            - **Clear cache** — wipe WebView cache and history from the overflow menu
            - **Lifecycle management** — WebView pauses/resumes with the Activity lifecycle
            - **Bumped all dependencies** to latest May 2026 versions

            ### Install
            Download `app-debug.apk` and sideload onto your Android device.
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: false
